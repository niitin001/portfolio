  <g>
    <text x="800" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#0B5A3C">About Us</text>
    <text x="800" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#3B463E">We are passionate about empowering farmers with the tools, knowledge, and resources they need</text>
    <text x="800" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#3B463E">to succeed. Our vision is to combine traditional farming practices with modern technology to create</text>
